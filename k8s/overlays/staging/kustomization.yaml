apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - namespace.yaml
  - sealed-secret.yaml

images:
  - name: nginx
    newTag: "1.25"

patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: webapp

commonLabels:
  environment: staging