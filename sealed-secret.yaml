apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: webapp-secret
  namespace: staging
  annotations:
    # This secret is encrypted with the staging cluster's public key.
    # It cannot be decrypted outside of the staging cluster.
    # Generated with: kubeseal --namespace staging --format yaml < secret.yaml > sealed-secret.yaml
    # The plaintext secret.yaml is NEVER committed to this repository.
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    # These values are encrypted ciphertext - safe to commit publicly.
    # To regenerate: echo -n 'your-value' | kubeseal --raw --namespace staging --name webapp-secret
    DB_PASSWORD: AgBY3k2x... # placeholder: replace with real kubeseal output
    API_KEY: AgCZ9m1y...     # placeholder: replace with real kubeseal output
  template:
    metadata:
      name: webapp-secret
      namespace: staging
    type: Opaque